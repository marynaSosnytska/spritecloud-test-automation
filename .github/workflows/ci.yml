name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: UI browsers to run (the API project always runs)
        type: choice
        options: [chromium, firefox, webkit, all]
        default: chromium

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Resolve browsers
        env:
          BROWSERS_INPUT: ${{ inputs.browsers }}
        run: |
          case "$BROWSERS_INPUT" in
            '') browsers=chromium ;;
            all) browsers='chromium firefox webkit' ;;
            *) browsers=$BROWSERS_INPUT ;;
          esac
          echo "BROWSERS=$browsers" >> "$GITHUB_ENV"

      - name: Install browsers
        run: npx playwright install --with-deps $BROWSERS

      - name: Run tests
        env:
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
          DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}
        run: |
          args=(--project=api)
          for browser in $BROWSERS; do
            args+=("--project=$browser")
          done
          npx playwright test "${args[@]}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: playwright-report/

  report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
